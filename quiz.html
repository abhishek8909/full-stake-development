<html>
<head>
    <title>MCQ Quiz</title>
    <style>
        /* General page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px; /* Padding for smaller screens */
            display: flex;
            justify-content: center;
        }

        /* Quiz container styling */
        .quiz-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px; /* Keeps the quiz from getting too wide */
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Question text */
        p.question {
            font-weight: bold;
            color: #222;
            font-size: 16px;
            margin-bottom: 12px;
            margin-top: 25px;
        }

        /* Options container */
        .option {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        /* Radio buttons and labels */
        input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2); /* Makes the radio button slightly larger */
            cursor: pointer;
        }

        label {
            cursor: pointer; /* Shows a pointer finger when hovering over the text */
            color: #555;
            font-size: 15px;
        }

        /* Submit button */
        input[type="submit"] {
            width: 100%;
            background-color: #007BFF;
            color: white;
            padding: 12px;
            margin-top: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        /* Submit button hover state */
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h2>MCQ Questions</h2>

    <form>

        <p>1. What does HTML stand for?</p>

        <input type="radio" name="q1">
        Hyper Text Markup Language
        <br>

        <input type="radio" name="q1">
        High Text Machine Language
        <br>

        <input type="radio" name="q1">
        Hyperlink Text Mark Language
        <br><br>


        <p>2. Which language is used to style a webpage?</p>

        <input type="radio" name="q2">
        HTML
        <br>

        <input type="radio" name="q2">
        CSS
        <br>

        <input type="radio" name="q2">
        Java
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
